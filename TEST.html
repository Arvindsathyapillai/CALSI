<!DOCTYPE html>
<html>
<head>
<title>Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body style="text-align: center;">
<div class="calculator">
<input type="text" id="res" class="calculator__output" placeholder="CALCULATOR">
<div class="calculator__keys">
<input type="button" class="calculator__key" value="C" onclick="Clear()" id="clear">
<input type="button" class="calculator__key" value="B" onclick="Back()" id="backspace">
<input type="button" class="calculator__key" value="%" onclick="Solve('%')">
<input type="button" class="calculator__key" value="/" onclick="Solve('/')">
<input type="button" class="calculator__key" value="9" onclick="Solve('9')">
<input type="button" class="calculator__key" value="8" onclick="Solve('8')">
<input type="button" class="calculator__key" value="7" onclick="Solve('7')">
<input type="button" class="calculator__key" value="X" onclick="Solve('*')">
<input type="button" class="calculator__key" value="6" onclick="Solve('6')">
<input type="button" class="calculator__key" value="5" onclick="Solve('5')">
<input type="button" class="calculator__key" value="4" onclick="Solve('4')">
<input type="button" class="calculator__key" value="-" onclick="Solve('-')">
<input type="button" class="calculator__key" value="3" onclick="Solve('3')">
<input type="button" class="calculator__key" value="2" onclick="Solve('2')">
<input type="button" class="calculator__key"value="1" onclick="Solve('1')">
<input type="button" class="calculator__key" value="+" onclick="Solve('+')">
<input type="button" class="calculator__key" value="00" onclick="Solve('00')">
<input type="button" class="calculator__key" value="0" onclick="Solve('0')">
<input type="button" class="calculator__key" value="." onclick="Solve('.')">
<input type="button" class="calculator__key" value="=" onclick="Result()">
</div>
</div>
<script src="index.js"></script>
</body>
</html>
